# Clipora AI gateway (free Cloudflare Worker). Deploy: see server/README.md
name = "clipora-ai"
main = "worker.js"
compatibility_date = "2026-09-01"

# Workers AI (FLUX pictures). Free: 10,000 neurons/day (~230 pictures).
[ai]
binding = "AI"

[vars]
# Pages allowed to call the gateway (comma separated). Add your web app's URL here.
ALLOWED_ORIGINS = "https://appassets.androidplatform.net,http://localhost:8080"
GROQ_MODELS = "openai/gpt-oss-120b,openai/gpt-oss-20b,qwen/qwen3.8-27b"
GEMINI_MODEL = "gemini-2.5-flash-lite"
WHISPER_MODEL = "whisper-large-v3-turbo"

# Per-IP limits so one user can't use up everyone's free quota.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "STT_LIMIT"
namespace_id = "1002"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "IMAGE_LIMIT"
namespace_id = "1003"
simple = { limit = 12, period = 60 }
