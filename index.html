<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Clipora – AI Video Editor</title>
  <meta name="description" content="Clipora is a free AI-powered video editor for Reels, Shorts and TikTok. Trim, split, captions, text, music, filters, remove pauses and auto shorts. No watermark.">
  <meta name="theme-color" content="#fbf5e9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Opening animation (removed by js/app.js once the app is ready) -->
  <div id="splash" aria-hidden="true">
    <div class="splash-orb o1"></div><div class="splash-orb o2"></div><div class="splash-orb o3"></div>
    <div class="splash-mark">
      <svg viewBox="0 0 120 120" width="112" height="112">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b553de"/><stop offset="1" stop-color="#f2527a"/></linearGradient></defs>
        <circle class="ring" cx="60" cy="60" r="52" fill="none" stroke="url(#sg)" stroke-width="6" stroke-linecap="round"/>
        <rect class="tile" x="26" y="26" width="68" height="68" rx="20" fill="url(#sg)"/>
        <path class="play" d="M52 44 L78 60 L52 76 Z" fill="#fff"/>
      </svg>
      <div class="splash-word"><span>C</span><span>l</span><span>i</span><span>p</span><span>o</span><span>r</span><span>a</span></div>
      <div class="splash-tag">AI Video &amp; Movie Studio</div>
    </div>
  </div>

  <!-- Home -->
  <section id="home" class="screen">
    <header class="home-head">
      <div class="brand"><img src="icons/icon.svg" alt="" width="36" height="36"><span>Clipora</span></div>
    </header>
    <div class="hero">
      <h1 data-t="tagline"></h1>
      <p data-t="sub"></p>
      <label class="btn-primary big">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <span data-t="newProject"></span>
        <input id="newInput" type="file" accept="video/*,image/*" multiple hidden>
      </label>
    </div>
    <div class="studio-cards">
      <button id="aiMovieBtn" class="studio-card movie" type="button"><span class="ic">✨</span><b>AI Movie</b><small>Idea or story → narrated movie</small></button>
      <button id="aiImageBtn" class="studio-card image" type="button"><span class="ic">🖼</span><b>AI Image</b><small>Describe it → picture</small></button>
    </div>
    <h2 class="section-title" data-t="yourProjects"></h2>
    <div id="projects" class="projects"></div>
    <p class="privacy">🔒 <span data-t="privacy"></span></p>
  </section>

  <!-- Editor -->
  <section id="editor" class="screen hidden">
    <header class="topbar">
      <button id="backBtn" class="icon-btn" type="button" aria-label="Back"></button>
      <input id="nameInput" class="name-input" maxlength="60" aria-label="Project name">
      <button id="undoBtn" class="icon-btn" type="button"></button>
      <button id="redoBtn" class="icon-btn" type="button"></button>
      <button id="exportBtn" class="btn-primary sm" type="button" data-t="export"></button>
    </header>
    <div class="stage" id="stage">
      <canvas id="preview" width="360" height="640"></canvas>
      <div id="emptyHint" class="empty-hint hidden" data-t="empty"></div>
      <button id="focusBtn" class="icon-btn sm stage-btn" type="button" aria-label="Focus view"><svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 5v4h2V5h4V3H5c-1.1 0-2 .9-2 2zm2 10H3v4c0 1.1.9 2 2 2h4v-2H5v-4zm14 4h-4v2h4c1.1 0 2-.9 2-2v-4h-2v4zm0-16h-4v2h4v4h2V5c0-1.1-.9-2-2-2z"/></svg></button>
    </div>
    <div class="transport">
      <span id="timeCur" class="timecode">00:00|00</span>
      <span id="timeTotal" class="time dim">0:00.0</span>
      <div class="play-group">
        <button id="prevBtn" class="icon-btn sm" type="button" aria-label="Previous clip"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
        <button id="playBtn" class="play-btn" type="button" aria-label="Play"></button>
        <button id="nextBtn" class="icon-btn sm" type="button" aria-label="Next clip"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      </div>
      <button id="zoomOut" class="icon-btn sm" type="button" aria-label="Zoom out">−</button>
      <button id="zoomIn" class="icon-btn sm" type="button" aria-label="Zoom in">+</button>
      <label class="icon-btn add-media" aria-label="Add media">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <input id="addInput" type="file" accept="video/*,image/*" multiple hidden>
      </label>
    </div>
    <div class="timeline-wrap">
      <div id="timeline" class="timeline"><div id="tlInner" class="tl-inner"></div></div>
      <div class="playhead"></div>
    </div>
    <div id="panel" class="panel"></div>
    <nav id="tabs" class="tabs"></nav>
  </section>

  <dialog id="exportDlg" class="dlg"></dialog>
  <dialog id="studioDlg" class="dlg studio"></dialog>
  <dialog id="confirmDlg" class="dlg small">
    <p id="confirmMsg"></p>
    <div class="row end">
      <button class="btn-ghost" value="no" data-close type="button" data-t="cancel"></button>
      <button class="btn-danger" value="yes" data-ok type="button" data-t="delete"></button>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <input id="srtInput" type="file" accept=".srt,text/plain" hidden>
  <input id="musicInput" type="file" accept="audio/*,video/*" hidden>
  <input id="overlayInput" type="file" accept="image/*,video/*" multiple hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
